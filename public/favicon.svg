<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" aria-label="Logo Marifarma">
  <defs>
    <!-- Sombra suave para la solapa de la letra M -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <g id="Isotipo-Marifarma">
    <!-- Cuerpo principal de la 'M' en verde -->
    <path fill="#009B48" d="M 110,130 
             C 110,105 130,90 155,90 
             L 215,90 
             C 238,90 252,102 265,120 
             L 345,90 
             C 370,90 390,105 390,130 
             L 390,305 
             C 390,330 370,350 345,350 
             L 330,350 
             C 305,350 290,330 290,305 
             L 290,265 
             L 220,335 
             C 210,345 195,350 180,350 
             L 155,350 
             C 130,350 110,330 110,305 
             Z" />

    <!-- Solapa/pliegue diagonal de la M (efecto 3D/superposición) -->
    <path fill="#008037" filter="url(#shadow)" d="M 215,90 
             L 345,260 
             L 345,220 
             L 245,90 
             Z" />

    <!-- Cruz médica blanca -->
    <path fill="#FFFFFF" d="M 180,185 L 195,185 L 195,170 C 195,164 200,160 206,160 L 224,160 C 230,160 235,164 235,170 L 235,185 L 250,185 C 256,185 260,190 260,196 L 260,214 C 260,220 256,225 250,225 L 235,225 L 235,240 C 235,246 230,250 224,250 L 206,250 C 200,250 195,246 195,240 L 195,225 L 180,225 C 174,225 170,220 170,214 L 170,196 C 170,190 174,185 180,185 Z" />

    <!-- Hoja amarilla (Naturaleza / Salud) -->
    <path fill="#FFC20E" d="M 225,350 
             C 225,350 220,260 300,220 
             C 300,220 295,310 225,350 Z" />

    <!-- Nervadura/Línea central de la hoja -->
    <path stroke="#009B48" stroke-width="5" stroke-linecap="round" fill="none" d="M 232,342 C 255,310 280,260 295,230" />
  </g>
</svg>
